spring:gitr branch 
            - id: huesped
              uri: lb://huesped
              predicates:
                - Path=/api/huesped/**
              filters:
                - StripPrefix=2

            - id: reservasHoteleras
              uri: lb://reservasHoteleras
              predicates:
                - Path=/api/reservasHoteleras/**
              filters:
                - StripPrefix=2

            - id: usuarios
              uri: lb://usuarios
              predicates:
                - Path=/api/usuarios/**
              filters:
                - StripPrefix=2

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true